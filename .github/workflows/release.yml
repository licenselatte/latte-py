name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm derives the version by walking back to the
          # nearest tag, which the default depth-1 checkout has no history
          # for. Without this the build silently produces a dev fallback
          # instead of the tagged version.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build distribution
        run: |
          pip install --upgrade build
          python -m build

      # setuptools-scm appends a .devN suffix to anything that is not an
      # exact, clean tag. That cannot happen on a tag-triggered run, so if
      # it does, the checkout is wrong (a shallow fetch, a dirty tree) and
      # publishing a dev build to PyPI would be worse than failing here.
      # This is the old guard inverted: it no longer asks you to keep a
      # number in sync, it just checks the machine agreed with itself.
      - name: Refuse to publish a non-release version
        run: |
          built="$(ls dist/*.whl | sed -E 's|.*/latte_py-([^-]+)-py3.*|\1|')"
          echo "Built version: $built"
          if [ "$built" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Built version $built does not match tag ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
